<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione sito · Antonio Burgello</title>
<!-- a private tool, not a page: keep it out of search results -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@350;400;500;600&display=swap">
<link rel="stylesheet" href="admin.css?v=1">
</head>
<body>

<!-- ============================================================
     The gate. Nothing below is fetched until the password is accepted,
     so an unauthenticated visitor sees a box and nothing else.
     ============================================================ -->
<div class="gate" id="gate">
  <form class="gate__box" id="loginForm">
    <p class="gate__eyebrow">Scuma Lab</p>
    <h1>Gestione del sito</h1>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Entra</button>
    <p class="gate__err" id="loginErr" role="alert" hidden></p>
  </form>
</div>

<!-- ============================================================
     The tool
     ============================================================ -->
<div class="app" id="app" hidden>

  <header class="bar">
    <span class="bar__name">Gestione del sito</span>
    <span class="bar__state" id="state">Caricamento…</span>
    <div class="bar__actions">
      <a class="btn btn--ghost" href="../index.html" target="_blank" rel="noopener">Vedi il sito</a>
      <button class="btn btn--save" id="saveBtn" disabled>Salva e pubblica</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="side" aria-label="Sezioni"></nav>
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<!-- the picture the browser shrinks into the two sizes the site needs -->
<canvas id="scratch" hidden></canvas>

<script src="admin.js?v=1"></script>
</body>
</html>
